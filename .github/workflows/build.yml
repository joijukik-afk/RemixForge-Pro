name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Fix gradlew permissions
        run: |
          chmod +x ./gradlew || true
          sed -i 's/\r$//' ./gradlew || true

      - name: Download SoundTouch
        run: |
          cd app/src/main/cpp
          git clone --depth 1 https://codeberg.org/soundtouch/soundtouch.git _st || true
          mkdir -p soundtouch
          cp _st/source/SoundTouch/*.cpp soundtouch/ 2>/dev/null || true
          cp _st/include/SoundTouch/*.h soundtouch/ 2>/dev/null || true
          rm -rf _st

      - name: Download LAME
        run: |
          cd app/src/main/cpp
          git clone --depth 1 https://github.com/rbrito/lame.git _lame || true
          mkdir -p lame
          cp _lame/libmp3lame/*.c lame/ 2>/dev/null || true
          cp _lame/libmp3lame/*.h lame/ 2>/dev/null || true
          cp _lame/include/lame.h lame/ 2>/dev/null || true
          rm -rf _lame

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RemixForge-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn
